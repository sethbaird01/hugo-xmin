{{ partial "header.html" . }}
<div class="article-meta">
<h3><span class="title">{{ .Title | markdownify }}</span></h3>
{{ with .Params.author }}<h4 class="author">{{ . }}</h4>{{ end }}
{{ if (gt .Params.date 0) }}<h4 class="date">Date written: {{ .Date.Format "2006/01/02" }}</h4>{{ end }}
</div>

<main>
{{ .Content }}
</main>

{{ partial "footer.html" . }}
